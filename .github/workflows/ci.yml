name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budget_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: budget_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_test -d budget_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://budget_test:test_only_password@localhost:5432/budget_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run test:integration
